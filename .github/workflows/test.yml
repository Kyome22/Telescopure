name: Test

on:
  workflow_dispatch:
    inputs:
      ui-test-flag:
        type: boolean
        description: Run UI tests?
        required: true
        default: false

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: "/Applications/Xcode_27.1.app/Contents/Developer"
      DERIVED_DATA: "DerivedData"
      CODE_SIGNING_ALLOWED: "NO"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Connect Hardware Keyboard OFF
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false

      - name: Build for Test
        run: |
          xcodebuild clean build-for-testing \
            -project Telescopure.xcodeproj \
            -scheme Telescopure \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=27.0" \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            -skipPackagePluginValidation \
            -skipMacroValidation |
            xcbeautify

      - name: Unit Test
        run: |
          xcodebuild test-without-building \
            -project Telescopure.xcodeproj \
            -scheme Telescopure \
            -only-testing:ModelTests \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=27.0" \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            -resultBundlePath TestResults/unit_test_result_bundle \
            -skipPackagePluginValidation \
            -skipMacroValidation |
            xcbeautify

      - name: UI Test
        if: inputs.ui-test-flag
        run: |
          xcodebuild test-without-building \
            -project Telescopure.xcodeproj \
            -scheme Telescopure \
            -only-testing:TelescopureUITests \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=27.0" \
            -derivedDataPath ${{ env.DERIVED_DATA }} \
            -resultBundlePath TestResults/ui_test_result_bundle \
            -skipPackagePluginValidation \
            -skipMacroValidation |
            xcbeautify
